name: macterm
options:
  bundleIdPrefix: com.zdenko.macterm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    # Vendored in-repo: this is a local fork of migueldeicaza/SwiftTerm and is
    # not reproducible from upstream. Do not repoint this at the remote.
    path: SwiftTermVendor
  Highlightr:
    url: https://github.com/raspu/Highlightr
    branch: master
targets:
  macterm:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - macterm.xcodeproj
          - .git
          - project-brain
          - task
          - scripts
          - macterm
          - SwiftTermVendor
          - Tests
          # Repo metadata, not app content. Anything under `.` that XcodeGen does
          # not recognise becomes a bundled resource, so a new top-level directory
          # lands inside the .app unless it is excluded here.
          - .github
          - docs
          - project.yml
          - .second-brain.json
          - .graphify_labels.json
          - graphify-out
    info:
      path: Info.plist
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Highlightr
        product: Highlightr
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zdenko.macterm
      ENABLE_HARDENED_RUNTIME: false
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
  # ---------------------------------------------------------------
  # Unit tests — additive target. Exercises the Liquid Glass
  # algorithm + renderer without depending on the rest of the app.
  # The macterm application target above is NOT modified.
  # ---------------------------------------------------------------
  mactermTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Glass/LiquidGlassAlgorithm.swift
      - path: Glass/LiquidGlassRenderer.swift
      - path: Glass/LiquidGlassGlassView.swift
      - path: Views/LiquidGlassAlgorithmSettingsView.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.zdenko.macterm.tests
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Tests/Info.plist
    dependencies:
      - sdk: XCTest.framework
