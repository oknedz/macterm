name: macterm
options:
  bundleIdPrefix: com.zdenko.macterm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    path: ../SwiftTermVendor
  Highlightr:
    url: https://github.com/raspu/Highlightr
    branch: master
targets:
  macterm:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes:
          - macterm.xcodeproj
          - .git
          - project-brain
          - task
          - scripts
          - SwiftTermVendor
          - macterm
    info:
      path: Info.plist
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Highlightr
        product: Highlightr
    settings:
        PRODUCT_BUNDLE_IDENTIFIER: com.zdenko.macterm
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
