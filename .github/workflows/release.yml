name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; the single job below is the only thing that writes, and
# only to publish the release.
permissions:
  contents: read

jobs:
  # One job, not two. Splitting build from publish means passing the DMG between
  # them as a workflow artifact and downloading it back on the publishing runner —
  # a round-trip that exists only because the jobs are separate. Built and kept in
  # one place: the DMG is uploaded as a workflow artifact and, on a tag push,
  # attached to the GitHub release. Nothing is ever pulled to a local machine.
  release:
    name: Build and publish DMG
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job pushes a tag's release, never the repository itself, so the
          # checkout does not need to leave a token in .git/config.
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      # The xcode-27 image ships without the Metal toolchain, and SwiftTerm
      # compiles Metal shaders. Same reason as the CI build job.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      # The same script used locally, so a published release cannot differ from
      # the build you tested on your machine.
      - name: Package release
        run: scripts/package-release.sh dist

      # The build is kept on GitHub, not shipped anywhere. Nothing in this workflow
      # pulls the DMG to a machine; you download it from the artifact list or the
      # release page if and when you want it.
      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacTerm-Release
          path: dist/MacTerm-Release.dmg
          if-no-files-found: error
          retention-days: 14

      - name: List DMG
        run: ls -lh dist/*.dmg

      # `gh` ships with the runner, so there is no third-party action to pin,
      # audit, or keep current.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/*.dmg "${args[@]}"