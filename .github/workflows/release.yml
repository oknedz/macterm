name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. The write grant belongs to the one job that publishes a
# release, not to the job that builds — zizmor flags workflow-level contents: write.
permissions:
  contents: read

jobs:
  # macOS only — a macOS app produces a single DMG, so there is no matrix here.
  # The DMG is assembled by scripts/package-release.sh, the same script used
  # locally, so a release cannot differ from what was tested on this machine.
  build:
    name: Build DMG
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No job here pushes; leaving the token in .git/config would hand it to
          # every later step for nothing.
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      # The xcode-27 image ships without the Metal toolchain, and SwiftTerm
      # compiles Metal shaders. Same reason as the CI build job.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Package release
        run: scripts/package-release.sh dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacTerm-Release
          path: dist/MacTerm-Release.dmg
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MacTerm-Release
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f -name "*.dmg" | sort

      # `gh` ships with the runner and already knows how to do this, so there is no
      # third-party action to pin, audit, or keep current.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--generate-notes --title "$TAG")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" artifacts/*.dmg "${args[@]}"