name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # macOS only — a macOS app produces a single DMG, so there is no matrix here.
  # The DMG is assembled by scripts/package-release.sh, the same script used
  # locally, so a release cannot differ from what was tested on this machine.
  build:
    name: Build DMG
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version

      # The xcode-27 image ships without the Metal toolchain, and SwiftTerm
      # compiles Metal shaders. Same reason as the CI build job.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Package release
        run: scripts/package-release.sh dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacTerm-Release
          path: dist/MacTerm-Release.dmg
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MacTerm-Release
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f -name "*.dmg" | sort

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/**/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}