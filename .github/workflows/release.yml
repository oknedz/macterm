name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the DMG under'
        required: true

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
      - name: Package release
        run: scripts/package-release.sh dist
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacTerm-Release
          path: dist/MacTerm-Release.dmg
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/MacTerm-Release.dmg --generate-notes