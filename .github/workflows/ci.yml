name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump when XcodeGen changes the generated project in a way that invalidates
  # the cache, or when SwiftTerm's toolchain floor moves.
  CACHE_EPOCH: v1

jobs:
  build:
    name: Build (Debug + Release)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ env.CACHE_EPOCH }}-build-${{ hashFiles('project.yml', '**/*.swift', 'macterm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ env.CACHE_EPOCH }}-build-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Debug
        run: xcodebuild build -project macterm.xcodeproj -scheme macterm -configuration Debug -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile
      - name: Build Release
        run: xcodebuild build -project macterm.xcodeproj -scheme macterm -configuration Release -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile

  test:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ env.CACHE_EPOCH }}-test-${{ hashFiles('project.yml', '**/*.swift', 'macterm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ env.CACHE_EPOCH }}-test-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test mactermTests
        run: xcodebuild test -project macterm.xcodeproj -scheme mactermTests -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile