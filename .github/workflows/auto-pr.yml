name: Auto Create PR

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: main
          title: '${{ github.ref_name }}'
          body: |
            Auto-generated PR from branch `${{ github.ref_name }}`

            **Commits:**
            ${{ github.event.commits && format('{0}{1}', '```', join(github.event.commits.*.message, '\n')) || 'No commits found' }}
            ${{ github.event.commits && '```' || '' }}
          labels: |
            auto-generated
          draft: false
          delete-branch: false