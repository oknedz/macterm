name: Auto Create PR

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # create-pull-request authenticates with the token passed below, so the
          # checkout does not need to leave one in .git/config.
          persist-credentials: false

      - name: Create PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: main
          title: '${{ github.ref_name }}'
          body: |
            Auto-generated PR from branch `${{ github.ref_name }}`

            **Commits:**
            ${{ github.event.commits && format('{0}{1}', '```', join(github.event.commits.*.message, '\n')) || 'No commits found' }}
            ${{ github.event.commits && '```' || '' }}
          labels: |
            auto-generated
          draft: false
          delete-branch: false